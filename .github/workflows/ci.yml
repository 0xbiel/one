name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: one
          POSTGRES_USER: one
          POSTGRES_PASSWORD: one
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U one -d one"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ONE_TEST_POSTGRES_URL: postgresql://one:one@127.0.0.1:5432/one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev,postgres]'
      - run: pytest
      - run: python scripts/generate_openapi.py
      - run: git diff --exit-code -- contracts/openapi.json
