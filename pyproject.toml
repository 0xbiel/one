[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "one-local-companion"
version = "0.1.0"
description = "Local-first ONE cognitive companion backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "cryptography>=43,<48",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "opencv-python-headless>=4.10,<5",
  "torch>=2.4,<3",
]
postgres = ["psycopg[binary]>=3.2,<4"]
redis = ["redis>=5,<6"]
s3 = ["boto3>=1.35,<2"]

[tool.pytest.ini_options]
testpaths = ["tests", "geometry_service/tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
