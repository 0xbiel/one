services:
  vision-worker:
    profiles: ["vision"]
    build:
      context: .
      dockerfile: geometry_service/Dockerfile
    environment:
      ONE_GEOMETRY_MODE: model
      ONE_GEOMETRY_MODEL_PATH: /models/yolov8s-worldv2.pt
      ONE_GEOMETRY_MODEL_CONFIG: /app/geometry_service/model_config.yolo-world.json
      ONE_FACE_DETECTOR_MODEL_PATH: /models/face/face_detection_yunet_2023mar.onnx
      ONE_FACE_RECOGNIZER_MODEL_PATH: /models/face/face_recognition_sface_2021dec.onnx
      # Docker Desktop on macOS cannot expose Metal/MPS to Linux containers.
      # Keep the Compose-managed worker on CPU so it is always available with
      # the API. The host-side worker can still be run manually for MPS speed.
      ONE_GEOMETRY_DEVICE: ${ONE_GEOMETRY_DOCKER_DEVICE:-cpu}
      ONE_GEOMETRY_ALLOW_CPU: ${ONE_GEOMETRY_DOCKER_ALLOW_CPU:-true}
      ONE_POSITIONING_WORKERS: ${ONE_POSITIONING_WORKERS:-3}
    volumes:
      - "${ONE_GEOMETRY_MODEL_PATH:?ONE_GEOMETRY_MODEL_PATH must point to the YOLO-World checkpoint}:/models/yolov8s-worldv2.pt:ro"
      - "${ONE_FACE_MODELS_PATH:-./data/face-models}:/models/face:ro"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).read()"
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      ONE_DATABASE_URL: ${ONE_DATABASE_URL:-postgresql://${ONE_POSTGRES_USER:-one}:${ONE_POSTGRES_PASSWORD:-change-me}@postgres:5432/${ONE_POSTGRES_DB:-one}}
      ONE_OBJECT_STORE_PATH: ${ONE_OBJECT_STORE_PATH:-/app/data/objects}
      ONE_BOOTSTRAP_SECRET: ${ONE_BOOTSTRAP_SECRET:-change-me-in-production}
      ONE_LIVEKIT_URL: ${ONE_LIVEKIT_URL:-ws://localhost:7880}
      # These match LiveKit's --dev placeholder credentials. Replace them for
      # any shared LAN or production deployment; no hosted LiveKit account is
      # used by this stack.
      ONE_LIVEKIT_API_KEY: ${ONE_LIVEKIT_API_KEY:-devkey}
      ONE_LIVEKIT_API_SECRET: ${ONE_LIVEKIT_API_SECRET:-secret}
      ONE_LM_STUDIO_URL: ${ONE_LM_STUDIO_URL:-http://host.docker.internal:1234/v1}
      ONE_LM_STUDIO_MODEL: ${ONE_LM_STUDIO_MODEL:-qwen3.6-35b-a3b}
      ONE_LM_STUDIO_API_KEY: ${ONE_LM_STUDIO_API_KEY:-}
      ONE_GEOMETRY_SERVICE_URL: ${ONE_GEOMETRY_SERVICE_URL:-http://vision-worker:8090}
      ONE_BIOMETRIC_ENCRYPTION_KEY_B64: ${ONE_BIOMETRIC_ENCRYPTION_KEY_B64:-}
      ONE_GEOMETRY_TIMEOUT_SECONDS: ${ONE_GEOMETRY_TIMEOUT_SECONDS:-45}
      ONE_GEOMETRY_LOCALIZATION_STALL_TIMEOUT_SECONDS: ${ONE_GEOMETRY_LOCALIZATION_STALL_TIMEOUT_SECONDS:-180}
      ONE_GEOMETRY_REQUIRE_GPU: ${ONE_GEOMETRY_REQUIRE_GPU:-false}
      ONE_CORS_ORIGINS: ${ONE_CORS_ORIGINS:-http://localhost:4173,http://localhost:4174,http://localhost:4175,http://127.0.0.1:4173,http://127.0.0.1:4174,http://127.0.0.1:4175}
      ONE_GEOCODER_BASE_URL: ${ONE_GEOCODER_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      livekit:
        condition: service_started
      vision-worker:
        condition: service_healthy
        required: false
    ports: ["${ONE_API_BIND:-127.0.0.1}:${ONE_API_PORT:-8000}:8000"]
    volumes: ["one_objects:/app/data/objects"]
  frontend:
    profiles: ["web"]
    build:
      context: ../one-frontend
      args:
        VITE_API_BASE_URL: ${ONE_FRONTEND_API_BASE_URL:-/api/v1}
        VITE_DEMO_MODE: ${ONE_FRONTEND_DEMO_MODE:-false}
    depends_on: [api]
    # Keep the default private to this Mac. Set ONE_FRONTEND_BIND=0.0.0.0
    # only for a controlled LAN test; Tailscale Serve can proxy the loopback
    # default without exposing the container on the whole LAN.
    ports: ["${ONE_FRONTEND_BIND:-127.0.0.1}:${ONE_FRONTEND_PORT:-4175}:80"]
  demo-service:
    profiles: ["demo"]
    build:
      context: ../one-demo-service
    ports: ["127.0.0.1:8100:8100"]
    # Demo data and sessions are isolated from the production API service.

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ONE_POSTGRES_DB:-one}
      POSTGRES_USER: ${ONE_POSTGRES_USER:-one}
      POSTGRES_PASSWORD: ${ONE_POSTGRES_PASSWORD:-change-me}
    volumes: ["one_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ONE_POSTGRES_USER:-one} -d ${ONE_POSTGRES_DB:-one}"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${ONE_MINIO_ROOT_USER:-one-local}
      MINIO_ROOT_PASSWORD: ${ONE_MINIO_ROOT_PASSWORD:-change-me-change-me}
    volumes: ["one_minio:/data"]
  livekit:
    image: livekit/livekit-server:latest
    # Self-hosted development server; no LiveKit Cloud subscription required.
    environment:
      # The WebRTC media path must advertise an address reachable by the
      # caregiver device, not the Docker bridge or an unrelated public IP.
      ONE_LIVEKIT_NODE_IP: ${ONE_LIVEKIT_NODE_IP:-}
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        if [ -n "$${ONE_LIVEKIT_NODE_IP:-}" ]; then
        exec /livekit-server --dev --bind 0.0.0.0 --node-ip "$${ONE_LIVEKIT_NODE_IP}";
        else exec /livekit-server --dev --bind 0.0.0.0; fi
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
  caddy:
    profiles: ["web"]
    image: caddy:2-alpine
    depends_on: [api, frontend]
    # Bind the local HTTPS proxy to the LAN for trusted same-Wi-Fi devices.
    # Caddy's internal CA certificate must be installed and trusted on those
    # devices before browser camera/microphone APIs will treat it as secure.
    ports:
      - "${ONE_CADDY_BIND:-127.0.0.1}:${ONE_CADDY_HTTPS_PORT:-8080}:443"
      - "[::]:${ONE_CADDY_HTTPS_PORT:-8080}:443"
      - "${ONE_CADDY_BIND:-127.0.0.1}:${ONE_CADDY_HTTP_PORT:-8081}:80"
      - "[::]:${ONE_CADDY_HTTP_PORT:-8081}:80"
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
volumes:
  one_objects:
  one_pg:
  one_minio:
  caddy_data:
  caddy_config:
