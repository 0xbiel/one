services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      ONE_DATABASE_URL: ${ONE_DATABASE_URL:-postgresql://${ONE_POSTGRES_USER:-one}:${ONE_POSTGRES_PASSWORD:-change-me}@postgres:5432/${ONE_POSTGRES_DB:-one}}
      ONE_OBJECT_STORE_PATH: ${ONE_OBJECT_STORE_PATH:-/app/data/objects}
      ONE_BOOTSTRAP_SECRET: ${ONE_BOOTSTRAP_SECRET:-change-me-in-production}
      ONE_LIVEKIT_URL: ${ONE_LIVEKIT_URL:-ws://localhost:7880}
      # These match LiveKit's --dev placeholder credentials. Replace them for
      # any shared LAN or production deployment; no hosted LiveKit account is
      # used by this stack.
      ONE_LIVEKIT_API_KEY: ${ONE_LIVEKIT_API_KEY:-devkey}
      ONE_LIVEKIT_API_SECRET: ${ONE_LIVEKIT_API_SECRET:-secret}
      ONE_LM_STUDIO_URL: ${ONE_LM_STUDIO_URL:-http://host.docker.internal:1234/v1}
      ONE_LM_STUDIO_MODEL: ${ONE_LM_STUDIO_MODEL:-qwen3.6-35b-a3b}
      ONE_LM_STUDIO_API_KEY: ${ONE_LM_STUDIO_API_KEY:-}
      # Room geometry inference stays on the Mac host so Apple Metal/MPS is
      # available; Docker Desktop cannot pass the host GPU through reliably.
      ONE_GEOMETRY_SERVICE_URL: ${ONE_GEOMETRY_SERVICE_URL:-http://host.docker.internal:8090}
      ONE_GEOMETRY_TIMEOUT_SECONDS: ${ONE_GEOMETRY_TIMEOUT_SECONDS:-45}
      ONE_GEOMETRY_REQUIRE_GPU: ${ONE_GEOMETRY_REQUIRE_GPU:-true}
      ONE_CORS_ORIGINS: ${ONE_CORS_ORIGINS:-http://localhost:4173,http://localhost:4174,http://localhost:4175,http://127.0.0.1:4173,http://127.0.0.1:4174,http://127.0.0.1:4175}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      livekit:
        condition: service_started
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["one_objects:/app/data/objects"]
  frontend:
    build:
      context: ../one-frontend
      args:
        VITE_API_BASE_URL: ${ONE_FRONTEND_API_BASE_URL:-/api/v1}
        VITE_DEMO_MODE: ${ONE_FRONTEND_DEMO_MODE:-false}
    depends_on: [api]
    # Keep the default private to this Mac. Set ONE_FRONTEND_BIND=0.0.0.0
    # only for a controlled LAN test; Tailscale Serve can proxy the loopback
    # default without exposing the container on the whole LAN.
    ports: ["${ONE_FRONTEND_BIND:-127.0.0.1}:${ONE_FRONTEND_PORT:-4175}:80"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ONE_POSTGRES_DB:-one}
      POSTGRES_USER: ${ONE_POSTGRES_USER:-one}
      POSTGRES_PASSWORD: ${ONE_POSTGRES_PASSWORD:-change-me}
    volumes: ["one_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ONE_POSTGRES_USER:-one} -d ${ONE_POSTGRES_DB:-one}"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${ONE_MINIO_ROOT_USER:-one-local}
      MINIO_ROOT_PASSWORD: ${ONE_MINIO_ROOT_PASSWORD:-change-me-change-me}
    volumes: ["one_minio:/data"]
  livekit:
    image: livekit/livekit-server:latest
    # Self-hosted development server; no LiveKit Cloud subscription required.
    command: --dev --bind 0.0.0.0
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
  caddy:
    image: caddy:2-alpine
    depends_on: [api, frontend]
    # Keep the local reverse proxy off the host's public interfaces. Use
    # Tailscale Serve for phone access, or override these bindings explicitly
    # when a controlled LAN ingress is required.
    ports:
      - "127.0.0.1:${ONE_CADDY_HTTPS_PORT:-8443}:443"
      - "127.0.0.1:${ONE_CADDY_HTTP_PORT:-8080}:80"
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
volumes:
  one_objects:
  one_pg:
  one_minio:
  caddy_data:
  caddy_config:
